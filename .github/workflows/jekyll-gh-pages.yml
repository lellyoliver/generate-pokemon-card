# Carta de Tecnologia — CI com env de produção (Secrets + Variables).
# Cadastre no GitHub:
#   Secret:  HF_TOKEN
#   Vars:    HF_MODEL, HF_PROVIDER, EMAIL_GATE, EMAIL_DOMAIN
# Pages não roda o server.js; este job sobe o Node só no runner do Actions.
name: Carta de Tecnologia

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL: ${{ vars.HF_MODEL }}
      HF_PROVIDER: ${{ vars.HF_PROVIDER }}
      EMAIL_GATE: ${{ vars.EMAIL_GATE }}
      EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
      HF_IMAGE_API: "1"
      PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Smoke server (prod env)
        run: |
          set -e
          node server.js &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" -o /tmp/health.json; then
              break
            fi
            sleep 1
          done
          echo "Health:"
          cat /tmp/health.json
          echo
          node -e '
            const h = require("/tmp/health.json");
            if (!h.ok) { console.error("health.ok false"); process.exit(1); }
            if (!h.hfConfigured) {
              console.error("HF_TOKEN não identificado (hfConfigured=false). Confira Secrets → HF_TOKEN.");
              process.exit(1);
            }
            console.log("Prod OK — provider=%s model=%s emailGate=%s domain=%s",
              h.provider, h.model, h.emailGateEnabled, h.emailDomain);
          '
