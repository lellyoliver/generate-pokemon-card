# Carta de Tecnologia — CI com env de produção (Secrets + Variables).
# Cadastre no GitHub:
#   Secret:  HF_TOKEN
#   Vars:    HF_MODEL, HF_PROVIDER, EMAIL_GATE, EMAIL_DOMAIN
# Pages não roda o server.js; este job sobe o Node só no runner do Actions.
name: Carta de Tecnologia

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prod:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL: "black-forest-labs/FLUX.1-Kontext-dev"
      HF_PROVIDER: "fal-ai"
      PORT: "3000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
