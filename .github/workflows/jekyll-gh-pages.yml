# Carta de Tecnologia — CI (Node). Não use o template Jekyll/GitHub Pages:
# este app precisa de servidor Node + HF_TOKEN; Pages só serve HTML estático.
name: Carta de Tecnologia

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pin image: ubuntu-latest moves to Ubuntu 26 from Oct 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Sem token real nos testes — o suite usa mocks offline.
          HF_TOKEN: ""
          HF_IMAGE_API: "0"
          EMAIL_GATE: "0"
